name: Run Tests Workflow
on:
  workflow_call:
    inputs:
      tests-folder:
        required: true
        type: string
jobs:
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vtanasa2792/playwright-env:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test tests/${{ inputs.tests-folder }}
        env:
          TEST_USERS: ${{ secrets.TEST_USERS }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.tests-folder }}
          path: playwright-report/
          retention-days: 30
