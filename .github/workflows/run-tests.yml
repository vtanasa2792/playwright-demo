name: Run Tests Workflow
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
jobs:
  tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vtanasa2792/playwright-demo-env:v1.59.1-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test --config configs/playwright.dev.config.ts --project=${{ inputs.project }}
        env:
          TEST_USERS: ${{ secrets.TEST_USERS }}
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.project }}
          path: playwright-report/
          retention-days: 30
